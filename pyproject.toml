[tool.poetry]
name = "octollm"
version = "0.5.0"
description = "OctoLLM - Distributed AI Architecture for Offensive Security and Developer Tooling"
authors = ["OctoLLM Team"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/doublegate/OctoLLM"
repository = "https://github.com/doublegate/OctoLLM"
documentation = "https://github.com/doublegate/OctoLLM/tree/main/docs"
keywords = ["ai", "llm", "distributed-systems", "security", "octopus-inspired"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
package-mode = false

[tool.poetry.dependencies]
# The project targets Python 3.14.x: the service images are python:3.14.7-slim and CI
# runs 3.14. The upper bound is not arbitrary either — presidio-analyzer/presidio-anonymizer
# 2.2.364 declare `Requires-Python <3.15`, so an open-ended range makes the lock unsolvable.
python = ">=3.14,<3.15"
fastapi = "^0.141.1"
pydantic = "^2.13.5"
pydantic-settings = "^2.15.0"
uvicorn = {extras = ["standard"], version = "^0.52.4"}
httpx = "^0.28.1"
redis = "^8.1.0"
psycopg = {extras = ["binary", "pool"], version = "^3.3.5"}
sqlalchemy = "^2.0.52"
alembic = "^1.20.0"
qdrant-client = "^1.19.0"
openai = "^3.13.0"
anthropic = "^1.5.0"
langchain = "^1.4.0"
langchain-openai = "^1.6.2"
structlog = "^26.1.0"
prometheus-client = "^0.26.0"
pyjwt = {extras = ["crypto"], version = "^2.14.0"}
tenacity = "^9.1.4"
python-multipart = "^0.0.32"
python-dotenv = "^1.2.3"
presidio-analyzer = "^2.2.364"
# Transitive pin, held here deliberately: presidio-analyzer accepts spacy >=3.4.4, and
# the resolver otherwise settles on spacy 3.7.5 -> srsly 2.4.8, which has no cp314 wheel
# and fails to compile against the 3.14 C API (PyObject_AsReadBuffer was removed). The
# 3.8.x line ships cp314 wheels. Drop this once presidio floors spacy itself.
spacy = "^3.8.16"
presidio-anonymizer = "^2.2.364"
tiktoken = "^0.14.0"
starlette = "^1.6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-cov = "^7.1.0"
pytest-mock = "^3.15.1"
pytest-timeout = "^2.4.0"
black = "^26.5.1"
ruff = "^0.16.7"
mypy = "^2.3.1"
pre-commit = "^4.6.2"
ipython = "^9.17.1"
httpx = "^0.28.1"

[tool.poetry.group.test.dependencies]
pytest-benchmark = "^5.3.0"
faker = "^40.38.0"
hypothesis = "^6.168.0"
locust = "^2.46.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py314"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["services", "shared", "octollm"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "S101",  # use of assert detected (pytest uses assert)
    "S104",  # possible binding to all interfaces
    "S608",  # possible SQL injection (false positives with SQLAlchemy)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",  # assert allowed in tests
    "T20",   # print allowed in tests
]
# CI helper scripts are command-line tools whose output IS stdout. Routing them
# through logging would put the diagnostics on stderr at a level GitHub's log
# viewer renders identically, at the cost of the ::error:: annotations.
"scripts/**/*.py" = [
    "T20",   # print is the interface
]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "redis.*",
    "qdrant_client.*",
    "langchain.*",
    "presidio_analyzer.*",
    "presidio_anonymizer.*",
    # The provider SDKs are optional extras of octollm-common, imported inside their
    # own constructors so the stack runs with none of them installed -- which is the
    # point, and which CI proves by installing none of them. A type check that
    # required them would make them hard dependencies through the back door.
    #
    # The cost is real and accepted: mypy cannot check the adapter calls against the
    # SDKs' own types in CI. That check still happens, in the one place it can -- a
    # local run with the extras present, which is how the `temperature` argument
    # anthropic>=1.5 no longer accepts was caught.
    "ollama.*",
    "openai.*",
    "anthropic.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config --cov=services --cov=shared/python --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "performance: marks tests as performance tests",
    "security: marks tests as security tests",
]
timeout = 30
timeout_method = "thread"

[tool.coverage.run]
source = ["services", "shared/python"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.bandit]
exclude_dirs = ["/tests", "/venv", "/.venv", "/docs"]
skips = ["B101"]  # Skip assert_used (common in tests)
