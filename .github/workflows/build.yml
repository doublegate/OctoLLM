name: Build

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Set minimal required permissions
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/octollm

jobs:
  build-python-services:
    name: Build Python Service - ${{ matrix.service }}
    runs-on: ubuntu-latest
    # NOTE: the eight service Dockerfiles DO exist (they were added after this comment
    # was written). This stays disabled because enabling it starts publishing images to
    # GHCR on every push to main, which is a deliberate call for the repository owner.
    # The Dockerfile paths and the multi-arch matrix below are correct as written, so
    # flipping this to `true` is all that is required.
    if: false  # Image publishing not enabled yet - see note above
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - orchestrator
          - planner
          - coder
          - judge
          - retriever
          - safety-guardian

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          # Only the orchestrator lives at services/<name>/; every arm is at
          # services/arms/<name>/. The previous unconditional path was wrong for five
          # of the six services in this matrix.
          file: services/${{ matrix.service == 'orchestrator' && 'orchestrator' || format('arms/{0}', matrix.service) }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ steps.meta.outputs.created }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ steps.meta.outputs.version }}
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
        if: github.event_name != 'pull_request'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: github.event_name != 'pull_request'
        with:
          sarif_file: 'trivy-${{ matrix.service }}.sarif'
        continue-on-error: true

  build-rust-services:
    name: Build Rust Service - ${{ matrix.service }}
    runs-on: ubuntu-latest
    # NOTE: the eight service Dockerfiles DO exist (they were added after this comment
    # was written). This stays disabled because enabling it starts publishing images to
    # GHCR on every push to main, which is a deliberate call for the repository owner.
    # The Dockerfile paths and the multi-arch matrix below are correct as written, so
    # flipping this to `true` is all that is required.
    if: false  # Image publishing not enabled yet - see note above
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - reflex-layer
          - executor

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ matrix.service == 'executor' && 'arms/executor' || matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ steps.meta.outputs.created }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ steps.meta.outputs.version }}
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
        if: github.event_name != 'pull_request'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: github.event_name != 'pull_request'
        with:
          sarif_file: 'trivy-${{ matrix.service }}.sarif'
        continue-on-error: true

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check build status
        run: |
          echo "📦 Build Workflow Status"
          echo ""
          echo "⏸️  Container builds are DISABLED"
          echo ""
          echo "Reason: publishing to GHCR is not switched on yet; the Dockerfiles exist."
          echo ""
          echo "Configured and ready to enable:"
          echo "- Python services: orchestrator, planner, coder, judge, retriever, safety-guardian"
          echo "- Rust services: reflex-layer, executor"
          echo "- Multi-architecture: linux/amd64, linux/arm64"
          echo "- Registry: ghcr.io/${{ github.repository_owner }}/octollm-*"
          echo "- Auto-tagging: branch, PR, semver, SHA"
          echo ""
          echo "To enable: change 'if: false' to 'if: true' in the two build jobs"
