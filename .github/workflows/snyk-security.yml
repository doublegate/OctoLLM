# Snyk Code (SAST) and Infrastructure-as-Code scanning.
#
# Snyk Open Source dependency scanning lives in security.yml (`dependency-scan-python`);
# this workflow covers the two things that one does not: SAST over the source and IaC
# over the Terraform/Kubernetes manifests.
#
# Container scanning is NOT here. There is no Dockerfile at the repository root, and the
# eight real service Dockerfiles are scanned with Trivy from build.yml. The upstream Snyk
# sample this file started from shipped a literal `docker build -t your/image-to-test .`
# placeholder, which failed on every run of this workflow.
#
# Requires the SNYK_TOKEN repository secret. Every Snyk step is guarded on it being set so
# that forks and token-less environments skip the scan rather than failing the check.
#
# Snyk CLI reference: https://docs.snyk.io/snyk-cli/cli-reference

name: Snyk Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  snyk:
    name: Snyk Code and IaC
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required on a private repo for upload-sarif to read the run status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for Snyk token
        id: token
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "SNYK_TOKEN is not set; skipping Snyk scans." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Snyk CLI
        if: steps.token.outputs.present == 'true'
        uses: snyk/actions/setup@12140f4059e244892ae643824a95459a102120dd

      # `snyk code test` exits non-zero when it finds issues, which would fail the check
      # before the SARIF is ever uploaded. Let it report, and surface findings through the
      # Security tab instead.
      - name: Snyk Code test (SAST)
        if: steps.token.outputs.present == 'true'
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --sarif-file-output=snyk-code.sarif

      - name: Snyk Open Source monitor
        if: steps.token.outputs.present == 'true' && github.event_name == 'push'
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk monitor --all-projects

      - name: Snyk IaC test
        if: steps.token.outputs.present == 'true'
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk iac test --report

      - name: Upload Snyk Code results to GitHub Code Scanning
        if: steps.token.outputs.present == 'true' && hashFiles('snyk-code.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-code.sarif
