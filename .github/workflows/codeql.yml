# CodeQL static analysis.
#
# The repository already runs bandit (Python), gitleaks (secrets), cargo-audit and
# npm audit (known-vulnerable dependencies), and optionally Snyk Code. None of those
# does interprocedural dataflow: bandit matches patterns within a file, and the audit
# tools only compare version numbers against an advisory database. CodeQL is the gate
# that can follow a value from an HTTP handler into a subprocess call across modules --
# the class of bug that matters most for a project whose executor arm is designed to
# run commands on behalf of a language model.
#
# Rust is analysed too. CodeQL's Rust support is newer than its Python and JavaScript
# support, and the reflex layer -- ~8,500 lines that terminate untrusted input before
# anything else sees it -- is the single most valuable thing here to analyse.
#
# Findings land in the Security tab rather than failing the build, which is why this
# workflow is deliberately NOT part of ci-gate: a dataflow engine's first run on an
# unanalysed codebase produces a backlog to triage, not a merge decision. Promote
# specific query results to blocking once that backlog is at zero.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly-published query reaches this repository without a push.
    - cron: "27 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      security-events: write # upload SARIF to the Security tab
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
          - language: rust
            build-mode: manual

    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust toolchain
        if: matrix.language == 'rust'
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache-workspaces: . -> target

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      # Rust needs a real compilation for CodeQL to build its database. `--all-targets`
      # so test and bench code is analysed too -- a test helper that shells out is still
      # a pattern worth knowing about.
      - name: Build Rust workspace
        if: matrix.language == 'rust'
        run: cargo build --workspace --all-targets --all-features

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
