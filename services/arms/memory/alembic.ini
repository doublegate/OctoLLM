# Alembic configuration for the Memory arm's `memory` schema.
#
# Memory owns its own migrations. That follows from the schema decision: the tables
# live in a dedicated `memory` schema so a compromised Memory arm cannot reach the
# orchestrator's, and a service that owns a schema owns its DDL. The orchestrator's
# `public` tables are not touched by anything here.
#
# The URL is supplied at run time from MEMORY_DATABASE_URL -- see alembic/env.py.
# Nothing is hardcoded here, because a connection string in a tracked file is a
# credential in a tracked file.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
