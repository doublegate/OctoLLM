[project]
name = "octollm-orchestrator"
version = "0.1.0"
description = "OctoLLM Orchestrator Service - Central brain for AI orchestration"
requires-python = ">=3.14,<3.15"
authors = [
    {name = "OctoLLM Team", email = "hello@octollm.org"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
keywords = ["ai", "orchestration", "llm", "distributed-systems"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "alembic>=1.20.0",
    "psycopg[binary]>=3.3.5",
    "httpx>=0.28.1",
    "tenacity>=9.1.4",
    "redis>=8.1.0",
    "prometheus-client>=0.26.0",
    "python-multipart>=0.0.32",
    "structlog>=26.1.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-psycopg2>=0.65b0",
    "opentelemetry-instrumentation-redis>=0.65b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "black>=26.5.1",
    "ruff>=0.16.7",
    "mypy>=2.3.1",
    "httpx>=0.28.1",
    "faker>=40.38.0",
    "aiosqlite>=0.22.1",
]

[build-system]
# setuptools >=83: everything below it is covered by a GitHub advisory, and a
# build-system floor is what Dependabot reads as the installed version.
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ['py314']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--junitxml=junit.xml",
    "-o",
    "junit_family=legacy",
    "--cov-fail-under=85",
]
markers = [
    "integration: integration tests requiring external services",
    "e2e: end-to-end tests",
    "slow: slow-running tests",
]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "redis.*",
    "prometheus_client.*",
    "structlog.*",
]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "app/telemetry.py",  # Pre-existing file, not part of Sprint 1.2
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
