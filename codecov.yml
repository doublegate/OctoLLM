# Codecov configuration for OctoLLM.
# Reference: https://docs.codecov.com/docs/codecov-yaml
#
# This file previously declared ten flags. Six of them -- planner-arm, coder-arm,
# judge-arm, retriever-arm, executor-arm and guardian-arm -- pointed at directories
# holding no source files at all, and `guardian-arm` pointed at `services/arms/guardian/`,
# which has never existed under that name (the directory is `safety-guardian`). A flag
# with `carryforward: true` that never receives an upload is not neutral: it reports the
# last value it saw forever, and one that never saw a value at all is a component the
# dashboard simply omits, silently.
#
# The rule for this file: a flag exists only when some CI job actually uploads coverage
# under it. Add the flag in the same change as the upload, not before.
#
# Uploading today (see .github/workflows/ci.yml):
#   orchestrator  -- services/orchestrator, pytest-cov, enforced at 85% by its own
#                    pytest config (`--cov-fail-under=85`); currently 91%.
#
# Not uploading yet, deliberately, each with the work that unblocks it:
#   reflex-layer  -- 240 Rust tests run in CI but produce no coverage report;
#                    needs cargo-llvm-cov wired into the test-rust job.
#   python-sdk    -- 28 tests run; its pytest config carries no --cov.
#   typescript-sdk-- 28 tests run; jest is invoked without --coverage.
#   the six arms  -- no source code exists to cover (Workstream D, stages 6-11).

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    # Scoped to the one component that reports. A repository-wide target computed from
    # a single uploading component is a number about the orchestrator wearing the name
    # of the whole repository; widen this as components start reporting.
    project:
      default:
        target: 85%
        threshold: 2%
        informational: false
        if_ci_failed: error
        flags:
          - orchestrator

    patch:
      default:
        target: 85%
        threshold: 5%
        informational: false
        if_ci_failed: error
        flags:
          - orchestrator

flags:
  orchestrator:
    paths:
      - services/orchestrator/
    carryforward: true

# Excluded from coverage calculations.
ignore:
  - "**/*.md"
  - "**/tests/**"
  - "**/test_*.py"
  - "docs/**"
  - "daily_logs/**"
  - "to-dos/**"
  - "**/conftest.py"
  - "**/__pycache__/**"
  - "**/venv/**"
  - "**/.venv/**"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/htmlcov/**"
  - "**/*.test.ts"
  - "**/*.test.js"
  - "**/*.spec.ts"
  - "**/*.spec.js"

# Test Analytics. Enabled by uploading JUnit XML with `report_type: test_results`;
# the orchestrator's pytest config already emits junit.xml. Retention is 60 days.
# https://docs.codecov.com/docs/test-analytics

# Bundle analysis is NOT configured. It requires a Vite/Webpack/Rollup plugin as a dev
# dependency, and the TypeScript SDK builds with plain `tsc` and ships no bundler. The
# previous `bundle_analysis` block and the two `require_bundle_changes` /
# `bundle_change_threshold` comment keys could therefore never fire.

comment:
  layout: "header, diff, flags, components, footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

github_checks:
  annotations: true
