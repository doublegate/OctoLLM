# Gitleaks configuration for OctoLLM.
#
# The previous version of this file had two independent defects, and the second hid
# the first.
#
# 1. IT DISCARDED EVERY BUILT-IN RULE. Gitleaks replaces its default ruleset when a
#    config defines `[[rules]]` unless `[extend] useDefault = true` is set. That file
#    defined about thirty custom rules and no `[extend]` block, so gitleaks' ~170
#    built-ins were silently dropped. Measured: a GitLab PAT (`glpat-…`) planted in a
#    source file produced zero findings under the old config and one under the same
#    config with `[extend] useDefault = true` added. Nothing about the scan output
#    indicated that 170 rules were missing -- it reported success.
#
# 2. THE PATH ALLOWLIST EXEMPTED MOST OF THE REPOSITORY. `.*\.md$` (every markdown
#    file anywhere), all of `docs/`, all of `ref-docs/`, all of `tests/`,
#    `infrastructure/.*\.(yml|yaml|sh)$`, `.github/workflows/.*\.yml$`, and
#    `services/reflex-layer/src/.*/patterns\.rs$`. A real credential committed into a
#    workflow file, a test fixture, an infrastructure shell script or any markdown
#    file was invisible to this scanner by construction.
#
#    `patterns.rs` is the sharpest example: it is the PII pattern corpus, which makes
#    it the file in this repository most likely to receive a genuine pasted key, and
#    it was blanket-exempted because it contains fake ones.
#
# The replacement rule for this file:
#
#   NO PATH IS EXEMPT EXCEPT GENERATED AND VENDORED TREES. Known-fake values are
#   exempted individually, by value, ANCHORED WITH ^...$ so an exemption cannot
#   substring-match a real secret. An unanchored `admin` in the old allowlist would
#   have suppressed any finding whose secret merely contained "admin".
#
# Adding a documentation example? Use one of the sanctioned placeholder forms below
# (`YOUR_…`, `…EXAMPLE…`, `CHANGE_ME_…`, or an elided `…abc…`), or add an anchored
# literal here with a comment saying where it appears. Do not add a path.
#
# `scripts/gitleaks-selftest.sh` plants four secrets in locations the OLD config
# exempted and asserts this config finds all four AND that the old config finds none.
# `make secrets-selftest` runs it; CI runs it on every pull request.

title = "OctoLLM"

# Keep gitleaks' ~170 built-in rules. Without this line the custom rules below
# REPLACE them rather than adding to them.
[extend]
useDefault = true

[allowlist]
description = "Generated and vendored trees, plus individually-anchored known-fake values."

# Generated output and third-party code only. Every one of these is either produced
# by a build or vendored from elsewhere, and none is a place a human commits a
# credential. Source, docs, tests, workflows and infrastructure are all scanned.
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)target/''',          # cargo build output
  '''(^|/)\.venv/''',
  '''(^|/)venv/''',
  '''\.egg-info/''',
  '''(^|/)htmlcov/''',         # coverage HTML
  '''(^|/)dist/''',            # tsc output
  '''(^|/)docs/book/''',       # generated mdBook output; docs/src/ IS scanned
]

# Sanctioned placeholder forms. These are the shapes documentation examples should
# use, and each is chosen so that a real credential cannot match it.
regexes = [
  # An elided value. A secret containing a literal three-dot run is unusable as a
  # credential -- real tokens are base64/hex/alphanumeric throughout.
  '''\.\.\.''',
  # Explicit placeholder markers, anchored so they must BE the whole secret.
  '''^YOUR_[A-Z0-9_]+$''',
  '''^your-[a-z0-9-]+-here$''',
  '''^CHANGE_ME[A-Za-z0-9_]*$''',
  '''(?i)EXAMPLE''',           # e.g. AKIAIOSFODNN7EXAMPLE, sk_test_EXAMPLE0000…

  # ------------------------------------------------------------------------------
  # Known-fake values already present in the tree, one anchored literal each.
  # Generated from an actual scan, then reviewed individually. Adding to this list
  # is a deliberate act; a real secret cannot match an anchored literal by accident.
  # ------------------------------------------------------------------------------
  '''^YOUR_JWT_TOKEN$''',                                          # docs/operations/kubernetes-deployment.md
  '''^c8d9e0f1\-a2b3\-4c5d\-6e7f\-8a9b0c1d2e3f$''',                # docs/security/capability-isolation.md (example token id)
  '''^cD0eF3gH6iJ9kL2mN5oP8qR1sT4uV7wX$''',                        # docs/operations/unraid-deployment-guide.md
  '''^fG1hI4jK7lM0nP3qR6sT9uV2wX5yZ8aB$''',                        # docs/operations/unraid-deployment-guide.md
  '''^gH4jK1lM7nP9qR2sT8vW5xY0zA3bC6dE$''',                        # docs/operations/unraid-deployment-guide.md
  '''^xK9fL2mN8vP4qR7sT1wU6yZ3aB5cD0eF$''',                        # docs/operations/unraid-deployment-guide.md
  '''^ghp_1234567890abcdefghijklmnopqrstuvwxyz$''',                # services/reflex-layer/src/pii/patterns.rs fixture
  '''^sk_test_1234567890abcdefghijklm$''',                         # services/reflex-layer/src/pii/patterns.rs fixture
  '''^octollm_live_1234567890abcdef$''',                           # docs/api/API-OVERVIEW.md
  '''^sk\-1234567890abcdef1234567890abcdef1234567890abcdef$''',    # docs/api/services/safety-guardian.md
  '''^sk\-12345abcdef67890$''',                                    # sdks/python/octollm-sdk/README.md
  '''^sk\-abc123def456ghi789jkl012mno345pqr678stu901$''',          # docs/security/gitleaks-configuration-audit.md
  '''^sk\-your\-key\-here$''',                                     # docs/development/local-setup.md
  '''^tok_abc123xyz$''',                                           # docs/api/openapi/executor.yaml
  # Documentation JWTs. Anchored on header plus enough payload to identify the fake
  # subject -- the HS256 header alone is identical for every JWT ever issued.
  '''^eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.abc''',   # sdks/python/.../tests/test_auth.py
  '''^eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiJleGVjdXRvci1hcm0iLCJpYXQ''', # docs/security/capability-isolation.md
]

commits = []

# ==============================================================================
# Project-specific rules
#
# These ADD to the built-ins rather than replacing them. Only formats gitleaks
# cannot know about belong here -- rules duplicating a built-in (GitHub PATs, AWS
# keys, Stripe keys, Slack tokens, JWTs, private keys, database URLs) were removed,
# because with `useDefault = true` they produced two findings for one secret.
# ==============================================================================

[[rules]]
  id = "octollm-api-key"
  description = "OctoLLM API key"
  # Non-capturing: gitleaks reports capture group 1 as "the secret" when a rule has
  # one, so `(live|test)` made every finding's secret the word "live" -- which no
  # anchored allowlist entry could ever match, and which tells a reader nothing.
  regex = '''octollm_(?:live|test)_[a-zA-Z0-9]{16,}'''
  tags = ["key", "octollm"]

[[rules]]
  id = "octollm-capability-token"
  description = "OctoLLM capability token"
  regex = '''\b(?:cap|tok)_[a-zA-Z0-9]{24,}'''
  tags = ["token", "octollm", "capability"]
